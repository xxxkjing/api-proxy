<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Proxy</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --ink-3: #86868b;
    --line: #e8e8ed;
    --accent: #0066cc;
    --danger: #d70015;
    --ok: #1d1d1f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 64px 32px 120px; }

  /* 登录 */
  #login-page { display: none; max-width: 340px; margin: 20vh auto 0; text-align: center; }
  #login-page h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 40px; }
  #login-page input {
    width: 100%; padding: 12px 16px; border: 1px solid var(--line);
    border-radius: 12px; font-size: 15px; text-align: center; outline: none;
    transition: border-color .2s;
  }
  #login-page input:focus { border-color: var(--accent); }
  #login-btn {
    width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 500; cursor: pointer;
  }
  #login-btn:hover { opacity: .9; }
  .login-err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* 顶部 */
  #panel { display: none; }
  .topbar {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 24px; border-bottom: 1px solid var(--line); margin-bottom: 48px;
  }
  .topbar h1 { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
  .topbar .sub { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
  #logout-btn {
    background: none; border: none; color: var(--ink-3); font-size: 14px;
    cursor: pointer; padding: 6px 0;
  }
  #logout-btn:hover { color: var(--ink); }

  /* 统计卡：极简数字排版 */
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 48px 24px; margin-bottom: 72px;
  }
  .card .label { font-size: 13px; color: var(--ink-3); font-weight: 400; margin-bottom: 8px; }
  .card .value { font-size: 34px; font-weight: 600; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .card .unit { font-size: 14px; color: var(--ink-3); font-weight: 400; margin-left: 2px; }

  /* 区块 */
  .section { margin-bottom: 80px; }
  .section-title { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 20px; }
  .section-desc { font-size: 13px; color: var(--ink-3); margin: -14px 0 20px; }

  /* 图表：极简网格线 */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .chart-box { min-width: 0; }
  .chart-box.wide { grid-column: 1 / -1; }
  .chart-box h3 { font-size: 13px; color: var(--ink-3); font-weight: 500; margin-bottom: 12px; }

  /* key 管理 */
  .key-form { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .key-form input {
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; outline: none; font-family: inherit;
  }
  .key-form input:focus { border-color: var(--accent); }
  .key-form .name { width: 180px; }
  .key-form .quota { width: 160px; }
  .key-form .models { width: 260px; }
  .key-form button {
    padding: 9px 22px; border: none; border-radius: 10px;
    background: var(--ink); color: #fff; font-size: 14px; cursor: pointer;
  }
  .key-form button:hover { background: #333; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; font-weight: 500; color: var(--ink-3); }
  td { color: var(--ink); }
  .key-value { font-family: "SF Mono", Menlo, monospace; font-size: 13px; color: var(--ink-2); }
  .badge { font-size: 12px; }
  .badge.on::before { content: "● "; color: #1d1d1f; }
  .badge.off::before { content: "● "; color: #d2d2d7; }
  .quota-num { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); }
  .op-link { color: var(--accent); cursor: pointer; font-size: 13px; margin-right: 14px; }
  .op-link.danger { color: var(--danger); }
  .op-link:hover { text-decoration: underline; }

  /* 日志 */
  .log-table { font-size: 13px; }
  .log-table td { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .status-ok { color: #1d1d1f; }
  .status-err { color: var(--danger); }
  .price-na { color: var(--ink-3); }
  .source-tag { font-size: 12px; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="container">
  <!-- 登录 -->
  <div id="login-page">
    <h1>API&nbsp;Proxy</h1>
    <input type="password" id="login-key" placeholder="管理密钥" autocomplete="off">
    <button id="login-btn">进入</button>
    <div class="login-err" id="login-err"></div>
  </div>

  <!-- 主面板 -->
  <div id="panel">
    <div class="topbar">
      <div>
        <h1>API&nbsp;Proxy</h1>
        <div class="sub" id="meta-info">—</div>
      </div>
      <button id="logout-btn">退出</button>
    </div>

    <div class="cards">
      <div class="card"><div class="label">总请求</div><div class="value" id="c-requests">0</div></div>
      <div class="card"><div class="label">总 Token</div><div class="value" id="c-tokens">0</div></div>
      <div class="card"><div class="label">首字延迟（流式）</div><div class="value" id="c-ttft">—<span class="unit">ms</span></div></div>
      <div class="card"><div class="label">响应耗时（非流式）</div><div class="value" id="c-lat">—<span class="unit">ms</span></div></div>
      <div class="card"><div class="label">429</div><div class="value" id="c-429">0</div></div>
      <div class="card"><div class="label">费用</div><div class="value" id="c-cost">$0</div></div>
    </div>

    <div class="section">
      <div class="charts">
        <div class="chart-box">
          <h3>请求量 / 分钟</h3>
          <canvas id="chart-requests"></canvas>
        </div>
        <div class="chart-box">
          <h3>Token / 分钟</h3>
          <canvas id="chart-tokens"></canvas>
        </div>
        <div class="chart-box wide">
          <h3>延迟 / 分钟 · 首字（流式）与总耗时（非流式）</h3>
          <canvas id="chart-latency"></canvas>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">API&nbsp;Key</div>
      <div class="key-form">
        <input class="name" id="new-key-name" placeholder="名称">
        <input class="quota" id="new-key-quota" placeholder="额度 token（默认 1000000）" type="number">
        <input class="models" id="new-key-models" placeholder="可选：限制模型（逗号分隔，留空不限）">
        <button id="create-key-btn">新建</button>
      </div>
      <table>
        <thead><tr><th>名称</th><th>Key</th><th>状态</th><th>额度</th><th>剩余</th><th>模型</th><th>创建</th><th></th></tr></thead>
        <tbody id="keys-tbody"></tbody>
      </table>
    </div>

    <div class="section">
      <div class="section-title">最近请求</div>
      <table class="log-table">
        <thead><tr><th>时间</th><th>模型</th><th>状态</th><th>TTFT</th><th>耗时</th><th>入</th><th>出</th><th>Key</th></tr></thead>
        <tbody id="logs-tbody"></tbody>
      </table>
    </div>

    <div class="section">
      <div class="section-title">模型价格 <span class="source-tag" id="models-source"></span></div>
      <table>
        <thead><tr><th>模型</th><th>提供商</th><th>输入</th><th>输出</th><th>备注</th></tr></thead>
        <tbody id="models-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let adminKey = sessionStorage.getItem('apiProxyAdminKey') || '';
const charts = {};

function initCharts() {
  const grid = 'rgba(0,0,0,.06)';
  Chart.defaults.color = '#86868b';
  Chart.defaults.borderColor = 'transparent';
  Chart.defaults.font.family = '-apple-system, "Helvetica Neue", "PingFang SC", sans-serif';
  Chart.defaults.font.size = 11;

  charts.requests = new Chart($('chart-requests'), {
    type: 'bar',
    data: { labels: [], datasets: [{ label: '请求', data: [], backgroundColor: 'rgba(0,0,0,.85)', barPercentage: .6 }] },
    options: { responsive: true, plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: grid } } } }
  });
  charts.tokens = new Chart($('chart-tokens'), {
    type: 'bar',
    data: { labels: [], datasets: [
      { label: '入', data: [], backgroundColor: 'rgba(0,0,0,.45)', barPercentage: .6 },
      { label: '出', data: [], backgroundColor: 'rgba(0,0,0,.85)', barPercentage: .6 },
    ]},
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, boxHeight: 8 } } },
      scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: grid } } } }
  });
  charts.latency = new Chart($('chart-latency'), {
    type: 'line',
    data: { labels: [], datasets: [
      { label: 'TTFT', data: [], borderColor: '#1d1d1f', backgroundColor: 'rgba(0,0,0,.04)', tension: .3, pointRadius: 0 },
      { label: '总耗时', data: [], borderColor: '#a1a1a6', backgroundColor: 'transparent', tension: .3, pointRadius: 0, borderDash: [4, 3] },
    ]},
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, boxHeight: 8 } } },
      scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: grid } } } }
  });
}

function fmtTokens(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n || 0);
}
function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtCost(c) {
  if (!c || c <= 0.0001) return '$0';
  return '$' + (+c).toFixed(4);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (adminKey) headers['Authorization'] = 'Bearer ' + adminKey;
  const resp = await fetch(path, Object.assign({ headers }, opts));
  if (resp.status === 401) throw new Error('UNAUTHORIZED');
  return resp.json();
}

async function loadStats() {
  try {
    const d = await api('/admin/api/stats');
    const t = d.totals || {};
    $('c-requests').textContent = t.requests || 0;
    $('c-tokens').textContent = fmtTokens(t.totalTokens);
    $('c-ttft').textContent = d.avgTtft != null ? d.avgTtft : '—';
    $('c-lat').textContent = d.avgLatency != null ? d.avgLatency : '—';
    $('c-429').textContent = t.err429 || 0;
    $('c-cost').textContent = fmtCost(t.cost);
    $('meta-info').textContent = `运行 ${d.uptimeSec ? Math.round(d.uptimeSec / 60) : 0} 分钟 · ${(d.models || []).length} 个模型 · 最近 ${(d.logs || []).length} 条请求`;

    const minutes = d.minutes || [];
    const labels = minutes.map(m => m.t.slice(11));
    charts.requests.data.labels = labels;
    charts.requests.data.datasets[0].data = minutes.map(m => m.requests);
    charts.requests.update('none');

    charts.tokens.data.labels = labels;
    charts.tokens.data.datasets[0].data = minutes.map(m => m.inputTokens);
    charts.tokens.data.datasets[1].data = minutes.map(m => m.outputTokens);
    charts.tokens.update('none');

    charts.latency.data.labels = labels;
    charts.latency.data.datasets[0].data = minutes.map(m => m.ttftAvg);
    charts.latency.data.datasets[1].data = minutes.map(m => m.latencyAvg);
    charts.latency.update('none');

    renderLogs(d.logs || []);
  } catch (e) {
    if (e.message === 'UNAUTHORIZED') showLogin();
  }
}

function renderLogs(logs) {
  const tb = $('logs-tbody');
  tb.innerHTML = logs.map(l => `
    <tr>
      <td>${fmtTime(l.ts)}</td>
      <td>${esc(l.model || '—')}</td>
      <td class="${l.status >= 400 ? 'status-err' : 'status-ok'}">${l.status}</td>
      <td class="num">${l.ttft != null ? l.ttft + 'ms' : '—'}</td>
      <td class="num">${l.latency != null ? l.latency + 'ms' : '—'}</td>
      <td class="num">${fmtTokens(l.inputTokens)}</td>
      <td class="num">${fmtTokens(l.outputTokens)}</td>
      <td>${esc(l.keyName || '—')}</td>
    </tr>`).join('');
}

async function loadKeys() {
  try {
    const d = await api('/admin/api/keys');
    const tb = $('keys-tbody');
    tb.innerHTML = (d.keys || []).map(k => `
      <tr>
        <td>${esc(k.name)}</td>
        <td><span class="key-value" title="点击复制" onclick="copyKey('${k.key}')">${k.key.slice(0, 18)}…</span></td>
        <td><span class="badge ${k.enabled ? 'on' : 'off'}">${k.enabled ? '启用' : '禁用'}</span></td>
        <td class="num">${fmtTokens(k.totalQuota)}</td>
        <td class="num">${fmtTokens(k.quota)}</td>
        <td class="num" style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${k.models && k.models.length ? esc(k.models.join(', ')) : '<span class="price-na">不限</span>'}</td>
        <td class="num">${fmtTime(k.createdAt)}</td>
        <td style="text-align:right">
          <span class="op-link" onclick="toggleKey('${k.key}', ${!k.enabled})">${k.enabled ? '禁用' : '启用'}</span>
          <span class="op-link danger" onclick="delKey('${k.key}')">删除</span>
        </td>
      </tr>`).join('');
  } catch (e) { if (e.message === 'UNAUTHORIZED') showLogin(); }
}

async function loadModels() {
  try {
    const d = await api('/admin/api/models');
    const tb = $('models-tbody');
    $('models-source').textContent = d.source === 'upstream' ? `· 来自端点 /v1/models（${d.count}）` : `· 内置价格表（端点不可达）`;
    tb.innerHTML = (d.models || []).map(m => `
      <tr>
        <td>${esc(m.id)}</td>
        <td>${esc(m.provider)}</td>
        <td class="num">${m.input != null ? '$' + m.input : '<span class="price-na">—</span>'}</td>
        <td class="num">${m.output != null ? '$' + m.output : '<span class="price-na">—</span>'}</td>
        <td class="price-na">${esc(m.note || '')}</td>
      </tr>`).join('');
  } catch (_) {}
}

function copyKey(k) { navigator.clipboard.writeText(k).then(() => alert('已复制')); }
async function toggleKey(key, enable) {
  await api('/admin/api/keys/toggle', { method: 'POST', body: JSON.stringify({ key, enabled: enable }) });
  loadKeys();
}
async function delKey(key) {
  if (!confirm('确定删除该 Key？')) return;
  await api('/admin/api/keys/delete', { method: 'POST', body: JSON.stringify({ key }) });
  loadKeys();
}

function showLogin() {
  adminKey = ''; sessionStorage.removeItem('apiProxyAdminKey');
  $('login-page').style.display = 'block'; $('panel').style.display = 'none';
}
function showPanel() {
  $('login-page').style.display = 'none'; $('panel').style.display = 'block';
  loadStats(); loadKeys(); loadModels();
}

document.addEventListener('DOMContentLoaded', () => {
  initCharts();
  $('login-btn').addEventListener('click', async () => {
    const key = $('login-key').value.trim();
    if (!key) return;
    adminKey = key;
    sessionStorage.setItem('apiProxyAdminKey', key);
    try { await api('/admin/api/stats'); $('login-err').textContent = ''; showPanel(); }
    catch (e) { $('login-err').textContent = '密钥无效'; }
  });
  $('login-key').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });
  $('logout-btn').addEventListener('click', showLogin);
  $('create-key-btn').addEventListener('click', async () => {
    const name = $('new-key-name').value.trim();
    const quota = parseInt($('new-key-quota').value, 10);
    const modelsStr = $('new-key-models').value.trim();
    if (!name) { alert('请输入名称'); return; }
    await api('/admin/api/keys', { method: 'POST', body: JSON.stringify({
      name,
      quota: quota > 0 ? quota : 1000000,
      models: modelsStr ? modelsStr.split(',').map(s => s.trim()).filter(Boolean) : null,
    }) });
    $('new-key-name').value = ''; $('new-key-quota').value = ''; $('new-key-models').value = '';
    loadKeys();
  });
  if (adminKey) showPanel(); else showLogin();
  setInterval(() => { if (adminKey && $('panel').style.display !== 'none') { loadStats(); loadKeys(); } }, 5000);
});
</script>
</body>
</html>
